
name: Extract ASTRAVION V1

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o ASTRAVION_FIREBASE_V1_SOURCE.zip -d .
          rm ASTRAVION_FIREBASE_V1_SOURCE.zip

      - name: Commit Unity project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets Packages ProjectSettings
          git commit -m "Extract ASTRAVION V1 Unity project" || echo "No changes"
          git push
